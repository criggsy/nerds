allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { subproject ->
    // Plugins (e.g. firebase_messaging) compile in separate modules; app/build.gradle
    // does not see their JavaCompile tasks. Apply javac lint here for full line-level output.
    subproject.afterEvaluate {
        subproject.tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
    }
}
